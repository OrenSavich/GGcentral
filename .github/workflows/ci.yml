name: CI

on:
  pull_request:
  workflow_call:

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ggcentral:ggcentral_local_only@localhost:5432/ggcentral
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Generate the Prisma client
        run: pnpm db:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate the Prisma schema
        run: pnpm db:validate

      - name: Keep PostgreSQL private in production Compose
        run: |
          if grep -n '5432:5432' deploy/docker-compose.yml; then
            echo 'Production Compose must not publish PostgreSQL.'
            exit 1
          fi
