name: ggcentral

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ggcentral}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ggcentral_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-ggcentral}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: ${API_PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ggcentral}:${POSTGRES_PASSWORD:-ggcentral_local_only}@postgres:5432/${POSTGRES_DB:-ggcentral}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-3001}:${API_PORT:-3001}'
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - /workspace/apps/api/src/generated
      - ./apps/api/prisma:/workspace/apps/api/prisma
      - ./apps/api/prisma7.config.ts:/workspace/apps/api/prisma7.config.ts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:'' + process.env.PORT + ''/health'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: development
      PORT: ${WEB_PORT:-3000}
      NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-3001}
    ports:
      - '${WEB_PORT:-3000}:${WEB_PORT:-3000}'
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/next.config.ts:/workspace/apps/web/next.config.ts
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
